[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hpr-qp"
version = "0.2.0"
description = "Accelerated First-Order Methods for Convex Composite Quadratic Programming"
readme = "README.md"
authors = [{ name = "Author", email = "research@optimization.ai" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "torch>=2.0.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 110
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
